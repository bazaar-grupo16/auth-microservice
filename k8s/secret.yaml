# ──────────────────────────────────────────────────────────────
# Kubernetes Secret — Authentication secrets for JWT
# ──────────────────────────────────────────────────────────────
# Complete secrets in GitHub repository secrets
apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
type: Opaque
stringData:
  SECRET_KEY: $SECRET_KEY

---

# ──────────────────────────────────────────────────────────────
# Kubernetes Secret — Database connection settings
# ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: auth-db-credentials
type: Opaque
stringData:
  DB_HOST: $DB_HOST
  DB_PORT: $DB_PORT
  DB_USER: $DB_USER
  DB_PASSWORD: $DB_PASSWORD
  DB_NAME: $DB_NAME
